name: CI Pipeline

on:
  push:
    branches: [ "**" ]   #para todas las ramas
  pull_request:
    branches: [ "**" ]
jobs:
  test:
    name: Build y Tests (Unitarios + Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven' # guardamos las dependemcias de maven en caché 

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B clean test

